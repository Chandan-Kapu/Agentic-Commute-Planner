name = "agentic-commute-planner"
main = "src/worker.ts"
compatibility_date = "2025-10-01"

# Static UI (public/) is served by Workers Static Assets; /api/* falls through to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

# Every 10 minutes. The Worker decides per user (in their time zone) whether it is
# night-plan time (~9 PM) or inside the morning re-plan window.
[triggers]
crons = ["*/10 * * * *"]

[vars]
TIMEZONE = "America/Los_Angeles"
NVIDIA_BASE_URL = "https://integrate.api.nvidia.com/v1"
# Tested on this account (Nov 2026): lightning ≈ 11 s per plan with accurate explanations; ultra ≈ 50 s.
NVIDIA_MODEL = "nvidia/nemotron-3.5-lightning-30b-a3b"
# Used automatically if NVIDIA_MODEL errors (404 not enabled for the account, 5xx, timeout).
NVIDIA_FALLBACK_MODEL = "nvidia/nemotron-3-ultra-550b-a55b"
# Set to "true" to let the cron job call the LLM too (costs tokens + subrequests).
CRON_LLM = "false"

# Optional: shared cache across isolates (strongly recommended — 511.org allows ~60 req/hour per key).
# npx wrangler kv namespace create CACHE   → paste the id below
# [[kv_namespaces]]
# binding = "CACHE"
# id = "<your-kv-id>"

# Secrets (npx wrangler secret put NAME) — see .dev.vars.example
